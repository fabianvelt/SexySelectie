# Fly.io-configuratie. Zie de README, kopje "Online zetten".
# Pas `app` aan naar een unieke naam; die bepaalt ook je adres (<app>.fly.dev).
app = "sexyselectie"
primary_region = "ams"

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DB_FILE = "/data/sexyselectie.db"

# SQLite en de realtime-verbindingen leven op één machine: niet opschalen
# naar meerdere machines zonder eerst naar Postgres + een pub/sub te gaan.
[mounts]
  source = "sexyselectie_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
